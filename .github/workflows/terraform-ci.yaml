name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-fmt-validate:
    name: Terraform Format and Validate
    uses: madhukankurte/Workflows/.github/workflows/terraform-fmt-validate.yaml@main
    with:
      terraform-version: "1.12.2"
      working-directory: "terraform"